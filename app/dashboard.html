<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stremfin Dashboard</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0c1220;color:#e8eefc}body{margin:0;background:radial-gradient(circle at top,#182744,#0c1220 55%);min-height:100vh}.wrap{max-width:920px;margin:auto;padding:32px 18px}.card{background:#121c30cc;border:1px solid #2b3a58;border-radius:18px;padding:24px;box-shadow:0 16px 45px #0004}h1{margin:0 0 8px}p{color:#aab8d4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}label{display:block;color:#b9c7df;font-size:.9rem;margin-bottom:7px}input,select{box-sizing:border-box;width:100%;border:1px solid #354666;background:#0b1425;color:#fff;border-radius:9px;padding:11px}fieldset{border:1px solid #2b3a58;border-radius:12px;margin:18px 0;padding:16px}legend{color:#8fb4ff;padding:0 8px}.checks{display:flex;flex-wrap:wrap;gap:12px}.checks label{display:flex;gap:6px;align-items:center}.checks input{width:auto}button{border:0;border-radius:9px;padding:10px 15px;background:#4785ff;color:white;font-weight:700;cursor:pointer}.remove{background:#873f58}.addon-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}#status{margin-left:12px;color:#8be0b5}.hint{font-size:.83rem}</style></head><body><main class="wrap"><section class="card"><button type="button" style="float:right" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location='/login')">Log out</button><h1>Stremfin</h1><p>Configure addon sources, metadata, debrid, and playback preferences.</p><form id="settings"><fieldset><legend>Debrid</legend><div class="grid"><div><label for="provider">Provider</label><select id="provider"><option value="none">None</option><option value="real-debrid">Real-Debrid</option><option value="torbox">TorBox</option></select></div><div><label for="key">API key</label><input id="key" type="password" autocomplete="off"></div></div></fieldset><fieldset><legend>Stream Addons</legend><div id="streamRows"></div><button type="button" onclick="addRow('streamRows')">+ Add Stream Addon</button></fieldset><fieldset><legend>Subtitle Addons</legend><div id="subtitleRows"></div><button type="button" onclick="addRow('subtitleRows')">+ Add Subtitle Addon</button><p class="hint">Subtitle addons should expose /subtitles/{movie|series}/{id}.json.</p></fieldset><fieldset><legend>Metadata</legend><label for="tmdb">TMDB API key (optional)</label><input id="tmdb" type="password"><p class="hint">Without a key, Stremfin uses Cinemeta's public catalog endpoints.</p></fieldset><fieldset><legend>Playback preferences</legend><label>Preferred resolutions</label><div class="checks"><label><input type="checkbox" name="resolution" value="4K">4K</label><label><input type="checkbox" name="resolution" value="1080p">1080p</label><label><input type="checkbox" name="resolution" value="720p">720p</label></div><label style="margin-top:14px">Preferred audio formats</label><div class="checks"><label><input type="checkbox" name="audio" value="EAC3">EAC3</label><label><input type="checkbox" name="audio" value="AC3">AC3</label><label><input type="checkbox" name="audio" value="AAC">AAC</label><label><input type="checkbox" name="audio" value="DTS">DTS</label></div></fieldset><button>Save settings</button><span id="status"></span></form></section></main><script>const $=id=>document.getElementById(id);function addRow(target,value=''){const row=document.createElement('div');row.className='addon-row';row.innerHTML=`<input data-addon="${target}" value="${value}" placeholder="https://addon.example"><button type="button" class="remove" onclick="this.parentElement.remove()">Remove</button>`;$(target).appendChild(row)}function rows(target){return [...document.querySelectorAll(`[data-addon=${target}]`)].map(x=>x.value.trim()).filter(Boolean)}function checked(name){return [...document.querySelectorAll(`input[name=${name}]:checked`)].map(x=>x.value)}async function load(){const r=await fetch('/api/settings');if(r.status===401)return location='/login';const s=await r.json();$('provider').value=s.debrid_provider;$('key').value=s.debrid_api_key;(s.stream_addon_urls||[]).forEach(x=>addRow('streamRows',x));(s.subtitle_addon_urls||[]).forEach(x=>addRow('subtitleRows',x));$('tmdb').value=s.tmdb_api_key;for(const x of s.preferred_resolutions)(document.querySelector(`input[name=resolution][value="${x}"]`)||{}).checked=true;for(const x of s.preferred_audio_formats)(document.querySelector(`input[name=audio][value="${x}"]`)||{}).checked=true}$('settings').onsubmit=async e=>{e.preventDefault();const body={debrid_provider:$('provider').value,debrid_api_key:$('key').value,stream_addon_urls:rows('streamRows'),subtitle_addon_urls:rows('subtitleRows'),tmdb_api_key:$('tmdb').value,preferred_resolutions:checked('resolution'),preferred_audio_formats:checked('audio')};const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('status').textContent=r.ok?'Saved':'Unable to save';setTimeout(()=>$('status').textContent='',2200)};load();</script></body></html>
