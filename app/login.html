<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stremfin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1220;color:#eef4ff;font-family:system-ui}.card{width:min(360px,calc(100% - 40px));background:#121c30;border:1px solid #304261;border-radius:16px;padding:28px;box-shadow:0 20px 50px #0006}h1{margin-top:0}label{display:block;color:#afbdd6;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #405477;background:#0a1426;color:#fff}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#4785ff;color:#fff;font-weight:700}#error{color:#ff9e9e;min-height:22px;margin-top:12px}</style></head><body><main class="card"><h1>Stremfin</h1><p>Admin dashboard sign-in</p><form id="login"><label>Username</label><input id="username" value="admin" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button>Sign in</button><div id="error"></div></form></main><script>login.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location='/dashboard';else error.textContent='Invalid username or password'}</script></body></html>
